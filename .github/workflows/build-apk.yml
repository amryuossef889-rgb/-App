name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, audit/security-ui-refresh]

concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate launcher icons from repository artwork
        run: |
          python3 -m pip install --disable-pip-version-check Pillow
          python3 data/scripts/generate_launcher_icons.py

      - name: Download pinned Bukhari and Muslim chapter data
        run: |
          set -e
          rm -rf data/raw/chapters
          mkdir -p data/raw/chapters/bukhari data/raw/chapters/muslim
          seq 1 97 | xargs -P 8 -I{} curl -fsSL --retry 3 "https://raw.githubusercontent.com/AhmedBaset/hadith-json/ca32fd72aa16eeeb9a819c80bb65c9e78766532d/db/by_chapter/the_9_books/bukhari/{}.json" -o "data/raw/chapters/bukhari/{}.json"
          seq 1 56 | xargs -P 8 -I{} curl -fsSL --retry 3 "https://raw.githubusercontent.com/AhmedBaset/hadith-json/ca32fd72aa16eeeb9a819c80bb65c9e78766532d/db/by_chapter/the_9_books/muslim/{}.json" -o "data/raw/chapters/muslim/{}.json"
          echo "Pinned chapter sources downloaded."

      - name: Expand verified Sunnah catalogue
        run: |
          python3 data/scripts/expand_sunnah_catalog.py
          python3 - <<'PY'
          import sqlite3
          db = "app/src/main/assets/databases/sunnah.db"
          con = sqlite3.connect(db)
          count = con.execute("SELECT COUNT(*) FROM Sunnah").fetchone()[0]
          hadiths = con.execute("SELECT COUNT(*) FROM Hadith").fetchone()[0]
          if count < 1000:
              raise SystemExit(f"Expected more than 1000 Sunnahs, found {count}")
          print(f"Verified catalogue: {count} Sunnahs / {hadiths} Hadiths")
          con.close()
          PY

      - name: Validate bundled database exists
        run: |
          test -f app/src/main/assets/databases/sunnah.db
          python3 - <<'PY'
          import sqlite3
          db = "app/src/main/assets/databases/sunnah.db"
          con = sqlite3.connect(db)
          print("Existing bundled DB:", db)
          print("SQLite integrity:", con.execute("PRAGMA integrity_check").fetchone()[0])
          con.close()
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '9.3.1'

      - name: Generate Room code
        run: gradle --no-daemon clean compileDebugKotlin --rerun-tasks

      - name: Repair bundled database Room schema
        run: python3 data/scripts/repair_bundled_db_schema.py

      - name: Patch bundled database with Room identity hash
        shell: bash
        run: |
          set -euo pipefail
          echo "Searching generated Room sources for identity metadata..."
          grep -RniE 'identityHash|identity_hash|room_master_table' app/build/generated 2>/dev/null | head -n 50 || true
          HASH="$(grep -RhoE '[0-9a-fA-F]{32}' app/build/generated 2>/dev/null | head -n 1 || true)"
          if [ -z "$HASH" ]; then
            echo "ERROR: Could not find a 32-character Room hash in generated sources."
            find app/build/generated -type f | head -n 100 || true
            exit 1
          fi
          echo "Found candidate Room hash: $HASH"
          ROOM_IDENTITY_HASH="$HASH" python3 data/scripts/patch_room_identity.py
      - name: Verify bundled database schema
        run: |
          python3 - <<'PY'
          import sqlite3
          db = "app/src/main/assets/databases/sunnah.db"
          con = sqlite3.connect(db)
          cur = con.cursor()
          required = {
              "Hadith": {
                  "id": "INTEGER NOT NULL PRIMARY KEY",
                  "collection": "TEXT NOT NULL",
                  "book": "TEXT NOT NULL",
                  "chapter": "TEXT NOT NULL",
                  "hadithNumber": "INTEGER NOT NULL",
                  "narrator": "TEXT NOT NULL",
                  "arabicText": "TEXT NOT NULL",
                  "sourceReference": "TEXT NOT NULL",
                  "authenticity": "TEXT NOT NULL",
                  "isAgreedUpon": "INTEGER NOT NULL",
                  "linkedHadithId": "INTEGER",
                  "rawId": "INTEGER NOT NULL",
                  "chapterId": "INTEGER NOT NULL",
                  "bookId": "INTEGER NOT NULL",
              },
              "Sunnah": {
                  "id": "INTEGER NOT NULL PRIMARY KEY",
                  "title": "TEXT NOT NULL",
                  "description": "TEXT NOT NULL",
                  "hadithId": "INTEGER NOT NULL",
                  "difficulty": "INTEGER NOT NULL",
                  "category": "TEXT NOT NULL",
                  "estimatedMinutes": "INTEGER NOT NULL",
                  "orderIndex": "INTEGER NOT NULL",
                  "isActive": "INTEGER NOT NULL",
              },
              "UserProgress": {
                  "id": "INTEGER NOT NULL PRIMARY KEY",
                  "currentSunnahId": "INTEGER NOT NULL",
                  "completedSunnahs": "TEXT NOT NULL",
                  "currentStreak": "INTEGER NOT NULL",
                  "longestStreak": "INTEGER NOT NULL",
                  "lastCompletedDate": "TEXT",
                  "startedDate": "TEXT NOT NULL",
              },
              "PdfBook": {
                  "id": "INTEGER NOT NULL PRIMARY KEY",
                  "title": "TEXT NOT NULL",
                  "description": "TEXT NOT NULL",
                  "filename": "TEXT NOT NULL",
                  "size": "INTEGER NOT NULL",
                  "addedDate": "INTEGER NOT NULL",
                  "isBuiltin": "INTEGER NOT NULL",
              },
          }
          for table, expected in required.items():
              rows = cur.execute(f"PRAGMA table_info({table})").fetchall()
              actual = {}
              for _, name, typ, notnull, _, pk in rows:
                  actual[name] = f"{typ} {'NOT NULL ' if notnull else ''}{'PRIMARY KEY' if pk else ''}".strip()
              if actual != expected:
                  raise SystemExit(f"Schema mismatch for {table}: {actual}")
          identity = cur.execute("SELECT identity_hash FROM room_master_table WHERE id=42").fetchone()
          if not identity or not identity[0]:
              raise SystemExit("Room identity hash missing")
          print("Room identity hash:", identity[0])
          print("Bundled Room schema verification: OK")
          print("SQLite integrity:", cur.execute("PRAGMA integrity_check").fetchone()[0])
          con.close()
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run JVM and Robolectric tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunnah-app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Configure release signing from repository secrets (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "\${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No production keystore secret supplied; Release outputs will not be production-signed."
            exit 0
          fi
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          {
            printf 'KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/release.keystore"
            printf 'STORE_PASSWORD=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo "Release signing material loaded from protected repository secrets."

      - name: Build optimized release APK and App Bundle
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Upload release APK and App Bundle
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sunnah-app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
